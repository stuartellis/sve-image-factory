
version: "3.50"

tasks:
  default:
    cmds:
      - task: list

  list:
    desc: List available tasks
    cmds:
      - "{{.TASK_EXE}} --list"

  build:image-builder:
    desc: Builds a container image for building container images
    cmds:
      - "docker build --device /dev/fuse --security-opt label=disable --tag '{{.IMAGE_TAG}}' docker/image-builder"
    vars:
      IMAGE_TAG: image-builder:bootstrap
